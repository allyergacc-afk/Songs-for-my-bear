.plinth{position:absolute;left:3%;top:3%;width:94%;height:94%;border:2px solid var(--ink);border-radius:16px 12px 17px 11px;transform:rotate(-.6deg);
background:repeating-linear-gradient(92deg,rgba(169,131,90,.05) 0 3px,transparent 3px 9px),#fcfaf4;box-shadow:3px 4px 0 rgba(42,34,24,.14),0 10px 24px rgba(80,60,30,.18)}
.plinth::before{content:"";position:absolute;inset:7px;border:1px dashed rgba(169,131,90,.7);border-radius:12px}
.platter{position:absolute;left:5%;top:7%;width:78%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#efe7d6 60%,#e0d4bb 100%);border:2px solid var(--ink);box-shadow:inset 0 0 0 5px #fcfaf4,inset 0 0 0 6px rgba(42,34,24,.35)}
.vinyl{position:absolute;inset:6%;border-radius:50%;animation:spin 3s linear infinite;animation-play-state:paused;box-shadow:0 3px 10px rgba(0,0,0,.3)}
.vinyl.on{animation-play-state:running}
.vinyl img{width:100%;height:100%;display:block;border-radius:50%}
.label{position:absolute;inset:32.4%;border-radius:50%;background:#ddd center/cover no-repeat;border:4px solid #0d0d0d}
.label::after{content:"";position:absolute;left:50%;top:50%;width:9px;height:9px;margin:-4.5px;border-radius:50%;background:#f6f1e7;box-shadow:inset 0 0 3px #000}
.arm{position:absolute;left:87%;top:12%;width:7px;height:58%;background:linear-gradient(90deg,#d8cdb9,#8f836d);border-radius:4px;transform-origin:50% 6px;transition:transform .9s ease;z-index:3;box-shadow:1px 2px 4px rgba(0,0,0,.25)}
.arm.on{transform:rotate(23deg)}
.arm::before{content:"";position:absolute;top:-16px;left:-13px;width:33px;height:33px;border-radius:50%;background:radial-gradient(circle,#8f836d 0 22%,#d8cdb9 24% 60%,#c4b8a2 62%);border:2px solid var(--ink)}
.arm::after{content:"";position:absolute;bottom:-14px;left:-5px;width:17px;height:22px;border-radius:3px;background:#6d6354;border:1.5px solid var(--ink)}
.knobs{position:absolute;left:6%;right:6%;bottom:4.5%;display:flex;align-items:center;justify-content:space-between;font-size:.6rem;color:var(--soft);letter-spacing:.12em}
.knob{width:22px;height:22px;border-radius:50%;border:2px solid var(--ink);background:conic-gradient(#fff,#d8cdb9,#fff,#d8cdb9,#fff);position:relative}
.knob::after{content:"";position:absolute;left:9px;top:2px;width:2px;height:7px;background:var(--ink);border-radius:2px}
.led{width:9px;height:9px;border-radius:50%;background:#cbbfa8;border:1.5px solid var(--ink)}
.led.on{background:#d8603f;box-shadow:0 0 6px #d8603f}
.sp{border:1.5px solid var(--ink);border-radius:10px;padding:1px 7px;color:var(--ink)}
.washi{position:absolute;width:22%;height:5.5%;background:rgba(214,190,150,.6);box-shadow:0 1px 2px rgba(0,0,0,.12);z-index:4}
.w1{left:-3%;top:0;transform:rotate(-38deg)}.w2{right:-3%;top:1%;transform:rotate(36deg);background:rgba(200,160,160,.5)}
.doodle{position:absolute;color:var(--sep);font-size:1rem;z-index:4}
.player{text-align:center;padding:2px 24px 0}
.now b{display:block;font:600 1.35rem/1 'Caveat',cursive}.now span{font-size:.75rem;color:var(--soft)}
input[type=range]{width:100%;accent-color:var(--ink);margin:6px 0 0}
.times{display:flex;justify-content:space-between;font-size:.66rem;color:var(--soft)}
.ctrl{display:flex;justify-content:center;gap:14px;margin-top:4px}
button{font-family:inherit;color:var(--ink);cursor:pointer}
.round{width:42px;height:42px;border-radius:50% 46% 52% 48%;border:2.5px solid var(--ink);background:#fff;font-size:.95rem}
.round.big{background:var(--ink);color:#fff}
.bottom{display:grid;grid-template-columns:42% 58%;margin-top:16px;padding:0 10px}
.left{display:flex;flex-direction:column;justify-content:space-between;align-items:center;position:relative}
.ttl{font-family:'La Belle Aurore',cursive;line-height:.95;color:var(--ink);transform:rotate(-4deg);margin:6px 0 0 4px;-webkit-text-stroke:.6px var(--ink)}
.ttl .big{font-size:3.5rem;display:inline-block;transform:translateY(4px)}
.ttl .w{font-size:2.1rem}
.ttl sup{font-size:1.3rem;position:relative;top:-8px;margin-left:2px}
.ttl .l2{display:block;margin-top:-2px}
.ttl small{font:.95rem 'Special Elite',serif;letter-spacing:.1em;-webkit-text-stroke:0;margin-right:4px}
.squig{display:block;width:88%;height:9px;margin:6px 0 0 6px;background:radial-gradient(circle at 5px 0,transparent 4px,var(--sep) 4.5px 5.5px,transparent 6px) 0 0/10px 9px repeat-x;opacity:.8;transform:rotate(-4deg)}
.photo{position:relative;width:92%;margin-top:14px;transform:rotate(2.2deg)}
.photo img{width:100%;display:block}
.photo .washi{width:34%;height:9%;left:30%;top:-3%;transform:rotate(-4deg)}
.right{padding-top:2px}
.lista{font-size:1.25rem;letter-spacing:.42em;text-align:center;margin:0 0 8px;padding-left:.42em}
.lista span{display:inline-block;border-bottom:2.5px solid var(--ink);padding:0 4px 3px;border-radius:2px 5px 3px 4px}
.lista i{color:var(--sep);font-style:normal;letter-spacing:0;font-size:.9rem;margin:0 3px}
.box{border:3px solid var(--ink);border-radius:5px 3px 8px 4px/4px 8px 3px 6px;padding:13px 10px;display:grid;gap:15px;background:#fff;box-shadow:3px 3px 0 rgba(42,34,24,.12)}
.tape{position:relative;aspect-ratio:2/1;background:var(--c,#efe9dc);border:2px solid var(--ink);border-radius:8px 7px 9px 6px;box-shadow:2px 3px 0 rgba(42,34,24,.2);cursor:pointer;transition:transform .2s}
.tape:nth-child(odd){transform:rotate(-.8deg)}.tape:nth-child(even){transform:rotate(.7deg)}
.tape.sel{transform:rotate(0) scale(1.03);box-shadow:0 0 0 2px var(--sep),3px 5px 0 rgba(42,34,24,.25)}
.tape::before,.tape::after{content:"";position:absolute;top:5%;width:4px;height:4px;border-radius:50%;background:var(--ink);opacity:.6}
.tape::before{left:2.5%}.tape::after{right:2.5%}
.lab{position:absolute;left:8%;right:8%;top:11%;height:44%;background:#fbf7ec repeating-linear-gradient(transparent 0 10px,rgba(169,131,90,.28) 10px 11px);border:1.5px solid var(--ink);border-radius:3px 4px 3px 5px;display:flex;align-items:center;gap:6px;padding:0 6px}
.th{width:28px;height:28px;border-radius:50%;object-fit:cover;border:1.5px solid var(--ink);flex:none}
.nm{min-width:0;flex:1;line-height:1}
.nm b,.nm span{display:block;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.nm b{font:600 15px 'Caveat',cursive}.nm span{font-size:8.5px;color:var(--soft);margin-top:2px}
.win{position:absolute;left:25%;right:25%;top:61%;height:23%;background:var(--ink);border-radius:20px/50%;display:flex;justify-content:space-around;align-items:center;padding:0 5%}
.reel{width:15px;height:15px;border-radius:50%;border:1.5px solid #f3ecdc;background:conic-gradient(#f3ecdc 0 12%,#5a4d3a 12% 25%,#f3ecdc 25% 37%,#5a4d3a 37% 50%,#f3ecdc 50% 62%,#5a4d3a 62% 75%,#f3ecdc 75% 87%,#5a4d3a 87%)}
.play .tape.sel .reel{animation:spin 1.5s linear infinite}
.base{position:absolute;bottom:0;left:17%;right:17%;height:12%;background:rgba(42,34,24,.16);clip-path:polygon(7% 0,93% 0,100% 100%,0 100%)}
.x{position:absolute;right:3px;bottom:0;border:none;background:none;font-size:.85rem;color:var(--soft);padding:2px 5px}
.addtoggle{display:block;margin:16px auto 0;padding:9px 16px;border:2.5px solid var(--ink);border-radius:5px 9px 5px 8px;background:#fff;font-size:.85rem;box-shadow:2px 2px 0 rgba(42,34,24,.15)}
.form{display:none;margin:14px 14px 0;padding:14px;border:3px solid var(--ink);border-radius:6px 3px 8px 4px/4px 8px 3px 6px;gap:8px;background:#fff}
.form.open{display:grid}
.form input[type=text]{width:100%;font-family:inherit;padding:9px;border:2px solid var(--ink);border-radius:4px;background:#fff;color:var(--ink)}
.pick{position:relative;display:block;padding:9px;border:2px dashed var(--sep);border-radius:4px;font-size:.82rem;text-align:center;cursor:pointer;color:var(--soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pick.ok{color:var(--ink);border-style:solid}
.pick input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:16px}
.addbtn{padding:10px;border:none;border-radius:4px;background:var(--ink);color:#fff}
.note{font-size:.66rem;color:var(--soft);text-align:center;margin:14px 20px 0}
</style>
</head>
<body>
<main>
<div class="top">

const audio=new Audio();
const IDB={db:null,
open(){return new Promise(res=>{try{const r=indexedDB.open('bear',1);r.onupgradeneeded=()=>r.result.createObjectStore('s',{keyPath:'id'});r.onsuccess=()=>{IDB.db=r.result;try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}res(true)};r.onerror=()=>res(false)}catch(e){res(false)}})},
all(){return new Promise(res=>{if(!IDB.db)return res([]);try{const q=IDB.db.transaction('s').objectStore('s').getAll();q.onsuccess=()=>res(q.result||[]);q.onerror=()=>res([])}catch(e){res([])}})},
put(o){if(!IDB.db)return;try{IDB.db.transaction('s','readwrite').objectStore('s').put(o)}catch(e){}},
del(id){if(!IDB.db)return;try{IDB.db.transaction('s','readwrite').objectStore('s').delete(id)}catch(e){}}};
let songs=[],cur=-1,audioFile=null,coverFile=null,coverData=null;
$('#label').style.backgroundImage='url("'+DEF+'")';
const fmt=t=>isFinite(t)?Math.floor(t/60)+':'+String(Math.floor(t%60)).padStart(2,'0'):'0:00';
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
function openForm(o){$('#form').classList.toggle('open',o);if(o)$('#form').scrollIntoView({behavior:'smooth',block:'center'})}
function render(){
  const box=$('#list');box.textContent='';
  const n=Math.max(5,songs.length);
  for(let i=0;i<n;i++){
    const s=songs[i],d=el('div','tape'+(i===cur?' sel':''));
    d.style.setProperty('--c',s?COL[i%COL.length]:'#f4efe4');
    const lab=el('div','lab'),nm=el('div','nm');
    if(s){const im=el('img','th');im.src=s.cover;im.alt='';lab.append(im);nm.append(el('b','',s.name),el('span','',s.artist||'—'))}
    lab.append(nm);
    const win=el('div','win');win.append(el('i','reel'),el('i','reel'));
    d.append(lab,win,el('div','base'));
    if(s){const x=el('button','x','✕');x.setAttribute('aria-label','Quitar');x.onclick=e=>{e.stopPropagation();remove(i)};d.append(x);d.onclick=()=>choose(i)}
    else d.onclick=()=>openForm(true);
    box.append(d);
  }
}
function choose(i){
  const s=songs[i];cur=i;audio.src=s.url;
  $('#label').style.backgroundImage='url("'+s.cover+'")';
  $('#title').textContent=s.name;$('#artist').textContent=s.artist||'—';
  audio.play().catch(()=>{});render();
}
function remove(i){
  if(i===cur){audio.pause();audio.removeAttribute('src');cur=-1;
    $('#title').textContent='Elige una canción';$('#artist').textContent='♡';
    $('#label').style.backgroundImage='url("'+DEF+'")';setState(false)}
  else if(i<cur)cur--;
  IDB.del(songs[i].id);songs.splice(i,1);render();
}
function setState(on){
  $('#vinyl').classList.toggle('on',on);$('#arm').classList.toggle('on',on);
  $('#led').classList.toggle('on',on);$('#list').classList.toggle('play',on);
  $('#play').textContent=on?'⏸':'▶';
}
audio.onerror=()=>{const s=songs[cur];if(s&&s.file&&!s.tried){s.tried=true;const r=new FileReader();r.onload=()=>{audio.src=r.result;audio.play().catch(()=>{})};r.readAsDataURL(s.file)}else{setState(false);$('#title').textContent='No se pudo reproducir';$('#artist').textContent='Prueba con otro archivo (mp3 o m4a)'}};
audio.onplay=()=>setState(true);
audio.onpause=()=>setState(false);
audio.onended=()=>{if(cur<songs.length-1)choose(cur+1);else setState(false)};
audio.ontimeupdate=()=>{$('#cur').textContent=fmt(audio.currentTime);if(audio.duration)$('#bar').value=audio.currentTime/audio.duration*100};
audio.onloadedmetadata=()=>{$('#dur').textContent=fmt(audio.duration)};
$('#bar').oninput=e=>{if(audio.duration)audio.currentTime=e.target.value/100*audio.duration};
$('#play').onclick=()=>{if(cur<0){if(songs.length)choose(0);return}audio.paused?audio.play().catch(()=>{}):audio.pause()};
$('#next').onclick=()=>{if(songs.length)choose((cur+1)%songs.length)};
$('#prev').onclick=()=>{if(songs.length)choose((cur-1+songs.length)%songs.length)};
$('#toggle').onclick=()=>openForm(!$('#form').classList.contains('open'));
$('#audioIn').onchange=e=>{
  audioFile=e.target.files[0]||null;$('#msg').textContent='';
  $('#audioPick').classList.toggle('ok',!!audioFile);
  $('#audioPick span').textContent=audioFile?'♪ '+audioFile.name:'♪ Subir audio';
  if(audioFile&&!$('#nameIn').value)$('#nameIn').value=audioFile.name.replace(/\.[^.]+$/,'');
};
$('#coverIn').onchange=e=>{
  coverFile=e.target.files[0]||null;coverData=null;
  if(coverFile){const r=new FileReader();r.onload=()=>{coverData=r.result};r.readAsDataURL(coverFile)}
  $('#coverPick').classList.toggle('ok',!!coverFile);
  $('#coverPick span').textContent=coverFile?'🖼 '+coverFile.name:'🖼 Imagen para el vinilo';
};
$('#addBtn').onclick=()=>{
  if(!audioFile){$('#audioPick').style.borderColor='#c0392b';$('#msg').textContent='Primero sube un audio';return}
  const song={id:Date.now(),file:audioFile,url:URL.createObjectURL(audioFile),name:$('#nameIn').value.trim()||audioFile.name,artist:$('#artistIn').value.trim(),cover:coverData||DEF};songs.push(song);IDB.put({id:song.id,file:song.file,name:song.name,artist:song.artist,cover:song.cover});
  audioFile=coverFile=coverData=null;
  ['audioIn','coverIn'].forEach(id=>$('#'+id).value='');
  $('#nameIn').value='';$('#artistIn').value='';
  $('#audioPick').classList.remove('ok');$('#audioPick').style.borderColor='';
  $('#audioPick span').textContent='♪ Subir audio';
  $('#coverPick').classList.remove('ok');$('#coverPick span').textContent='🖼 Imagen para el vinilo';
  openForm(false);render();
};
render();
IDB.open().then(async ok=>{if(!ok)return;const a=await IDB.all();a.sort((x,y)=>x.id-y.id);a.forEach(r=>songs.push({...r,url:URL.createObjectURL(r.file)}));render()});
</script>
</body>
</html>
